<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Random Station</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      color: white;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      box-sizing: border-box;
      overflow: hidden;
      background: #000;
    }

    /* 背景サムネ */
    #bg {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(28px);
      transform: scale(1.12);
      opacity: 0.45;
      z-index: -2;
      transition: background-image 0.8s ease;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(40,40,40,0.4), rgba(0,0,0,0.9));
      z-index: -1;
    }

    /* ロゴ */
    #logo {
      width: 260px;
      max-width: 65vw;
      opacity: 0.95;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.6));
    }

    #player {
      width: 90vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 90px rgba(0,0,0,0.7);
      background: black;
    }

    .label {
      font-size: 12px;
      opacity: 0.6;
      letter-spacing: 0.2em;
    }

    #nowTitle {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      max-width: 900px;
      line-height: 1.4;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    }

    button {
      font-size: 20px;
      padding: 14px 36px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      background: white;
      color: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    button:active {
      transform: scale(0.98);
    }

    .small {
      font-size: 12px;
      opacity: 0.45;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="bg"></div>
  <div id="overlay"></div>

  <!-- ロゴ表示 -->
  <img src="logo.png" id="logo" alt="logo">

  <div id="player"></div>

  <div class="label">NOW PLAYING</div>
  <div id="nowTitle">再生ボタンを押してください</div>

  <button id="playBtn">▶ 再生</button>

  <div class="small">
    最初はランダム再生、その後はプレイリスト順に再生されます
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const PLAYLIST_ID = "PLcopHZdckrjT63rBpTPrzCa59g-0cWOmf";
    const MAX_INDEX = 300;

    let player;
    let isPlaying = false;

    const playBtn = document.getElementById("playBtn");
    const nowTitle = document.getElementById("nowTitle");
    const bg = document.getElementById("bg");

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: {
          listType: "playlist",
          list: PLAYLIST_ID,
          autoplay: 0,
          controls: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onStateChange: onPlayerStateChange
        }
      });
    }

    playBtn.addEventListener("click", () => {
      if (!player) return;

      if (!isPlaying) {
        startRandom();
      } else {
        stop();
      }
    });

    function startRandom() {
      const randomIndex = Math.floor(Math.random() * MAX_INDEX);

      player.loadPlaylist({
        listType: "playlist",
        list: PLAYLIST_ID,
        index: randomIndex
      });

      isPlaying = true;
      playBtn.textContent = "■ 停止";
      nowTitle.textContent = "選曲中...";
    }

    function stop() {
      player.stopVideo();

      isPlaying = false;
      playBtn.textContent = "▶ 再生";
      nowTitle.textContent = "停止中";
      bg.style.opacity = "0.2";
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.textContent = "■ 停止";
        updateNowPlaying();
      }
    }

    function updateNowPlaying() {
      try {
        const data = player.getVideoData();
        nowTitle.textContent = data.title || "再生中";

        if (data.video_id) {
          const url = `https://img.youtube.com/vi/${data.video_id}/maxresdefault.jpg`;
          bg.style.backgroundImage = `url("${url}")`;
        }
      } catch (e) {
        nowTitle.textContent = "再生中";
      }
    }
  </script>

</body>
</html>
