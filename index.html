<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Podcast Radio</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 900px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      opacity: 0.7;
      margin-bottom: 16px;
    }

    #player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    button {
      margin-top: 16px;
      font-size: 18px;
      padding: 12px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🎧 Podcast Radio</h1>
  <p>ランダムな回から自動再生されます</p>

  <div id="player"></div>

  <button onclick="start()">▶ 再生する</button>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const PLAYLIST_ID = "PLcopHZdckrjT63rBpTPrzCa59g-0cWOmf";
const VIDEO_COUNT = 170;

let player;
let started = false;

// プレイヤー準備
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    playerVars: {
      listType: 'playlist',
      list: PLAYLIST_ID,
      controls: 1,
      rel: 0,
      modestbranding: 1
    }
  });
}

// 再生スタート（ユーザー操作必要対策）
function start() {
  if (started) return;

  const randomIndex = Math.floor(Math.random() * VIDEO_COUNT);

  player.loadPlaylist({
    list: PLAYLIST_ID,
    listType: 'playlist',
    index: randomIndex,
    startSeconds: 0
  });

  started = true;
}
</script>

</body>
</html>
