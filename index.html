<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Random Station</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #333 0%, #111 50%, #000 100%);
      color: white;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0.08em;
    }

    .label {
      font-size: 12px;
      opacity: 0.6;
      letter-spacing: 0.2em;
    }

    #player {
      width: 90vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 80px rgba(0,0,0,0.6);
      background: black;
    }

    #nowTitle {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      max-width: 900px;
      line-height: 1.4;
    }

    button {
      font-size: 20px;
      padding: 14px 36px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      background: white;
      color: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
    }

    .small {
      font-size: 12px;
      opacity: 0.4;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="label">YOUTUBE RANDOM STATION</div>
  <h1>Random Station</h1>

  <div id="player"></div>

  <div class="label">NOW PLAYING</div>
  <div id="nowTitle">再生ボタンを押してください</div>

  <button id="playBtn">▶ 再生</button>

  <div class="small">
    最初はランダム再生、その後はプレイリスト順に再生されます
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const PLAYLIST_ID = "PLcopHZdckrjT63rBpTPrzCa59g-0cWOmf";
    const MAX_INDEX = 300;

    let player;
    let isPlaying = false;

    const playBtn = document.getElementById("playBtn");
    const nowTitle = document.getElementById("nowTitle");

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: {
          listType: "playlist",
          list: PLAYLIST_ID,
          autoplay: 0,
          controls: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onStateChange: onPlayerStateChange
        }
      });
    }

    playBtn.addEventListener("click", () => {
      if (!player) return;

      if (!isPlaying) {
        startRandom();
      } else {
        stop();
      }
    });

    function startRandom() {
      const randomIndex = Math.floor(Math.random() * MAX_INDEX);

      player.loadPlaylist({
        listType: "playlist",
        list: PLAYLIST_ID,
        index: randomIndex
      });

      isPlaying = true;
      playBtn.textContent = "■ 停止";
      nowTitle.textContent = "選曲中...";
    }

    function stop() {
      player.stopVideo();

      isPlaying = false;
      playBtn.textContent = "▶ 再生";
      nowTitle.textContent = "停止中";
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.textContent = "■ 停止";
        updateTitle();
      }

      if (event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        playBtn.textContent = "▶ 再生";
        nowTitle.textContent = "再生ボタンを押してください";
      }
    }

    function updateTitle() {
      try {
        const data = player.getVideoData();
        nowTitle.textContent = data.title || "再生中";
      } catch (e) {
        nowTitle.textContent = "再生中";
      }
    }
  </script>

</body>
</html>
